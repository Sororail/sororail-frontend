name: Setup workspace
description: Install pnpm, Node.js and the workspace dependencies. Run actions/checkout first.

inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: "22"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
