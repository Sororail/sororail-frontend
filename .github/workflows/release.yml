name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance (packages/sdk/package.json publishConfig).
  id-token: write

jobs:
  release:
    name: version packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm build
      # Without a publish command this only opens or updates the "version
      # packages" PR, which is the dry run. Publishing needs the repository
      # variable SDK_PUBLISH_ENABLED=true and the NPM_TOKEN secret. See
      # .changeset/README.md.
      - uses: changesets/action@v2
        with:
          version: pnpm changeset version
          publish: ${{ vars.SDK_PUBLISH_ENABLED == 'true' && 'pnpm changeset publish' || '' }}
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
