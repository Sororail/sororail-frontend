name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The integration job below only runs on these two.
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    strategy:
      matrix:
        node-version: [20, 21, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      # @sororail/sdk only exposes its type declarations from dist/, built by
      # tsup, so apps/web can't typecheck against it until this runs first.
      - run: pnpm build
      # Budget for the client JS the reference app ships.
      - run: pnpm --filter @sororail/web bundle:check
      # Fails when the SDK's exported types change without the snapshot being
      # updated, so a breaking change is always a visible, deliberate diff.
      - run: pnpm --filter @sororail/sdk api:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm audit
      # Playwright needs a built app and its own browser download.
      # Cache browser binaries to avoid re-downloading on every run (#111).
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pnpm exec playwright --version)" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - name: Install Playwright system deps only
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps
      - run: pnpm test
      # Coverage is reported once, on the newest Node version in the matrix.
      - name: SDK test coverage
        if: matrix.node-version == 22
        run: pnpm --filter @sororail/sdk test:coverage
      - uses: actions/upload-artifact@v4
        if: matrix.node-version == 22
        with:
          name: sdk-coverage
          path: packages/sdk/coverage/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-node-${{ matrix.node-version }}
          path: apps/web/playwright-report/
          retention-days: 7

  changeset:
    name: changeset present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # Advisory: a PR that changes published behaviour should carry a
      # changeset. Not every PR needs one, so this reports rather than blocks.
      # Surface the result as a workflow warning so it's visible in the PR
      # checks UI instead of silently discarded (#113).
      - name: Check for changeset
        id: changeset
        run: pnpm exec changeset status --since=origin/main
        continue-on-error: true
      - name: Warn if changeset is missing
        if: steps.changeset.outcome == 'failure'
        run: |
          echo "::warning::No changeset found. If this PR changes published behaviour, add one with \`pnpm exec changeset\`."
          echo "### ⚠️ No changeset found" >> "$GITHUB_STEP_SUMMARY"
          echo "If this PR changes published behaviour, add one with \`pnpm exec changeset\`." >> "$GITHUB_STEP_SUMMARY"

  # The examples talk to a real network, so they run on a schedule rather than
  # on every PR. Each one asserts what it demonstrates, so together they are the
  # SDK's integration suite. The job funds its own throwaway testnet accounts
  # through friendbot (no secrets) and deploys a fresh instance of each contract
  # per run, because testnet resets and every contract but batch_payout is
  # claimed permanently by its first `create`/`init`.
  integration:
    name: examples against testnet
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: stellar/stellar-cli@v23.0.1
      - name: Check out the contracts
        uses: actions/checkout@v4
        with:
          repository: Sororail/sororail-contracts
          path: contracts
      - name: Build the contracts
        working-directory: contracts
        run: |
          rustup target add wasm32v1-none
          stellar contract build
      - name: Run the examples
        working-directory: packages/sdk
        env:
          WASM_DIR: ${{ github.workspace }}/contracts/target/wasm32v1-none/release
        run: pnpm test:integration
